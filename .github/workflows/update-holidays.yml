name: 공휴일 목록 갱신

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 (한국 시간)
  workflow_dispatch: # Actions 탭에서 손으로도 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 특일 정보 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python update_holidays.py

      - name: 바뀌었으면 올리기
        run: |
          if git diff --quiet holidays.json; then
            echo "바뀐 게 없어요"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          git commit -m "공휴일 목록 갱신 $(date +%Y-%m-%d)"
          git push
